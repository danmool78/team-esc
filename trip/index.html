<style>*{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 한 장씩 넘겨 보는 카드뉴스: 가운데 카드(4:5), 아래에 쪽 점과 앞뒤 단추. 카드 색(크림·주황빛 갈색)에 맞춘 어두운 갈색 바탕 하나로 */
:root{--bg:#2a211b;--panel:#3a2e26;--fg:#f6efe3;--muted:#c9b8a4;--accent:#d9653d;--ui:"Noto Sans KR",system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);display:flex;flex-direction:column;align-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 18px;box-sizing:border-box;overflow:hidden}
header{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
header h1{font-size:17px;font-weight:900;margin:0;letter-spacing:.2px;text-wrap:balance}
header span{font-size:13px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stage{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.track{height:100%;max-height:min(100%,calc((100vw - 32px) * 1.25));aspect-ratio:4/5;max-width:100%;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.45);scrollbar-width:none;background:var(--panel)}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;margin:0;scroll-snap-align:center;scroll-snap-stop:always}
.slide img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;background:rgba(246,239,227,.92);color:#2a211b;font-size:26px;font-weight:900;cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.nav:disabled{opacity:0;pointer-events:none}
.nav:focus-visible,.dots button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.prev{left:max(0px,calc(50% - 340px))}.next{right:max(0px,calc(50% - 340px))}
.dots{display:flex;gap:10px;margin-top:14px}
.dots button{width:10px;height:10px;border-radius:5px;border:0;padding:0;background:rgba(246,239,227,.3);cursor:pointer;transition:width .25s,background .25s}
.dots button[aria-current="true"]{width:28px;background:var(--accent)}
.hint{margin-top:8px;font-size:12.5px;color:var(--muted)}
@media (max-width:640px){.nav{display:none}}
@media (prefers-reduced-motion:reduce){.track{scroll-behavior:auto}.dots button{transition:none}}
</style>
<header><h1>비전 중등부 · 익산·전주 하루 여행</h1><span id="count">1 / 6</span></header>
<div class="stage">
  <button class="nav prev" id="prev" aria-label="이전 장">‹</button>
  <div class="track" id="track" tabindex="0" aria-label="카드뉴스"><figure class="slide" id="s1" aria-roledescription="slide" aria-label="1 / 6"><img src="card1.jpg" alt="표지: 익산·전주 하루 여행, 10월 31일(토) 오전 8시 45분 교회 집결" draggable="false"></figure><figure class="slide" id="s2" aria-roledescription="slide" aria-label="2 / 6"><img src="card2.jpg" alt="하루 일정: 08:45 출발부터 18:00 도착까지" draggable="false"></figure><figure class="slide" id="s3" aria-roledescription="slide" aria-label="3 / 6"><img src="card3.jpg" alt="오전: 익산 고스락 모닝커피와 장독대 산책, 전주 굴비정식 점심" draggable="false"></figure><figure class="slide" id="s4" aria-roledescription="slide" aria-label="4 / 6"><img src="card4.jpg" alt="오후: 도자기 만들기 체험과 전주 한옥마을 투어" draggable="false"></figure><figure class="slide" id="s5" aria-roledescription="slide" aria-label="5 / 6"><img src="card5.jpg" alt="한옥마을 투어는 비전 퀘스트로: 포켓몬 GO처럼 걸으며 하는 팀 미션 게임" draggable="false"></figure><figure class="slide" id="s6" aria-roledescription="slide" aria-label="6 / 6"><img src="card6.jpg?v=3" alt="참가 안내: 일시, 집결, 회비, 준비물" draggable="false"></figure></div>
  <button class="nav next" id="next" aria-label="다음 장">›</button>
</div>
<div class="dots" id="dots" role="tablist"></div>
<p class="hint">옆으로 밀거나 화살표를 눌러 넘겨 보세요</p>
<script>
const track = document.getElementById('track'), slides = [...track.children], n = slides.length;
const dots = document.getElementById('dots'), count = document.getElementById('count');
slides.forEach((_, i) => { const b = document.createElement('button'); b.setAttribute('aria-label', (i + 1) + '번째 장'); b.onclick = () => go(i); dots.appendChild(b); });
let cur = 0;
const show = i => {
  cur = i; count.textContent = (i + 1) + ' / ' + n;
  [...dots.children].forEach((d, k) => d.setAttribute('aria-current', k === i));
  document.getElementById('prev').disabled = i === 0; document.getElementById('next').disabled = i === n - 1;
  if (location.hash !== '#s' + (i + 1)) history.replaceState(null, '', '#s' + (i + 1));
};
const go = i => { i = Math.max(0, Math.min(n - 1, i)); track.scrollTo({ left: i * track.clientWidth }); show(i); };
// 손으로 밀어 넘긴 것도 쪽 번호에 반영
let t; track.addEventListener('scroll', () => { clearTimeout(t); t = setTimeout(() => { const i = Math.round(track.scrollLeft / track.clientWidth); if (i !== cur) show(i); }, 80); });
document.getElementById('prev').onclick = () => go(cur - 1);
document.getElementById('next').onclick = () => go(cur + 1);
addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(cur + 1); if (e.key === 'ArrowLeft') go(cur - 1); });
addEventListener('resize', () => track.scrollTo({ left: cur * track.clientWidth, behavior: 'instant' }));
// 주소의 #s3 같은 쪽으로 열기 (특정 장을 바로 보낼 수 있게)
const fromHash = () => { const m = /^#s(\d)$/.exec(location.hash); return m ? Math.min(n, Math.max(1, +m[1])) - 1 : 0; };
addEventListener('hashchange', () => { const i = fromHash(); if (i !== cur) go(i); });
requestAnimationFrame(() => { const i = fromHash(); track.style.scrollBehavior = 'auto'; track.scrollLeft = i * track.clientWidth; track.style.scrollBehavior = ''; show(i); });
</script>

</body>
