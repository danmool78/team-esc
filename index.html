<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 화면 크기 고정: 확대 막기(maximum-scale은 아이폰 입력칸 확대까지 막는다), 자판이 떠도 화면 배치는 그대로(interactive-widget) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
<title>비전 퀘스트</title>
<!-- 배포할 때 GitHub Actions가 커밋 번호로 바꾼다. app.js의 BUILD와 다르면 예전 화면을 들고 있는 것 → 새로 불러온다 -->
<meta name="build" content="__BUILD__">
<script>
  // 비상구: 앱이 시작하다 오류가 나거나 20초 안에 첫 화면이 안 뜨면 '다시 불러오기'를 보인다 (행사 중 진갈색 빈 화면에 갇히지 않게)
  addEventListener('error', function () { if (!window.__booted) setTimeout(rescue, 300); });
  setTimeout(function () { if (!window.__booted) rescue(); }, 20000);
  function rescue() { var r = document.getElementById('rescue'); if (r && !window.__booted) { r.hidden = false; window.hideSplash && hideSplash(true); } }
  async function hardReload() {
    try { (await navigator.serviceWorker?.getRegistrations() || []).forEach(function (x) { x.unregister(); }); } catch (e) {}
    try { (await caches.keys()).filter(function (k) { return k.indexOf('tiles') < 0; }).forEach(function (k) { caches.delete(k); }); } catch (e) {}
    var u = new URL(location.href); u.searchParams.set('v', Date.now()); location.replace(u);
  }
</script>
<meta name="theme-color" content="#15110d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<!-- 아이폰 홈 화면은 SVG 아이콘을 못 써서 PNG를 따로 둔다 -->
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="비전 퀘스트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 시작 화면: 앱을 열 때마다 로고와 '비전 퀘스트'가 등장한다. 앱을 불러오는 동안의 빈 화면도 이것으로 덮는다.
     앱을 연 뒤 2.8초쯤 지나면 사라진다(누르면 바로). 시작에 실패해 비상구가 뜰 땐 그 전에 걷는다 -->
<div class="splash" id="splash" onclick="window.hideSplash && hideSplash(true)">
  <div class="sp-rays"></div>
  <img class="sp-logo" src="assets/icon-512.png" alt="">
  <div class="sp-title">비전 퀘스트</div>
  <div class="sp-sub">VISION QUEST</div>
  <div class="sp-tag">전주에서 팀별로 걷는 미션 게임</div>
</div>
<script>
  // 시작 화면 걷기: 너무 빨리 사라지면 등장이 안 보이니 연 뒤 2.8초는 둔다 (다 등장한 화면을 1초쯤 보게)
  window.hideSplash = function (now) {
    var s = document.getElementById('splash'); if (!s || s.classList.contains('out')) return;
    var wait = now ? 0 : Math.max(0, 2800 - performance.now());
    setTimeout(function () { s.classList.add('out'); setTimeout(function () { s.remove(); }, 500); }, wait);
  };
  setTimeout(function () { window.hideSplash(true); }, 19000); // 비상구(20초)보다 먼저
</script>

<!-- 로그인 -->
<!-- 대문: 금빛 햇살 위에 앱 아이콘과 게임 제목, 둘레에 미션 아이콘들이 떠 있다 -->
<section id="auth" class="screen gate" hidden>
  <div class="gate-rays"></div>
  <span class="float" data-ic="pin" style="left:7%;top:12%"></span>
  <span class="float" data-ic="quiz" style="right:8%;top:9%;animation-delay:-.8s"></span>
  <span class="float" data-ic="camera" style="left:9%;bottom:3%;animation-delay:-1.6s"></span>
  <span class="float" data-ic="flag" style="right:10%;bottom:4%;animation-delay:-2.3s"></span>
  <div class="gate-hero">
    <img class="gate-logo" src="assets/icon-512.png" alt="">
    <p class="eyebrow">VISION QUEST</p>
    <h1 class="gate-title">비전 퀘스트</h1>
    <p class="gate-sub">전주에서 팀별로 걷는 미션 게임</p>
    <div class="gate-types"><span data-ic="pin">도착</span><span data-ic="quiz">퀴즈</span><span data-ic="camera">사진</span><span data-ic="flag">현장 미션</span></div>
  </div>
  <div class="card narrow">
    <button id="googleBtn" class="btn wide google"><span>G</span> 구글 계정으로 시작</button>
    <div class="or">또는 이메일</div>
    <form id="emailForm" class="stack">
      <input id="email" type="email" placeholder="이메일" autocomplete="email" required>
      <input id="pw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" minlength="6" required>
      <button class="btn wide primary" id="emailBtn">로그인</button>
    </form>
    <div class="row between fine">
      <button class="link" id="toggleSign">처음이에요 — 가입하기</button>
      <button class="link" id="resetBtn">비밀번호를 잊었어요</button>
    </div>
    <p class="msg" id="authMsg"></p>
  </div>
</section>

<!-- 처음 한 번: 이름과 인형 -->
<section id="profile" class="screen center" hidden>
  <div class="card narrow">
    <p class="eyebrow">내 인형</p>
    <h2 class="title sm">지도 위에서 나를 대신할 인형</h2>
    <div class="avatarbox"><img id="avatarImg" alt=""><button class="btn ghost small" id="reroll" data-ic="dice">다시 뽑기</button></div>
    <div class="seg" id="genderSeg"><button data-g="m" class="on">남자</button><button data-g="f">여자</button></div>
    <label class="fine">별칭 — 지도 이름표와 검색에 쓰여요
      <input id="profName" placeholder="별칭 (2~12자)" maxlength="12" minlength="2"></label>
    <button class="btn wide primary" id="profSave">이대로 할게요</button>
  </div>
</section>

<!-- 게임 고르기 -->
<section id="lobby" class="screen center" hidden>
  <div class="card narrow">
    <div class="row between">
      <div class="me"><img id="lobbyAvatar" alt=""><div><b id="lobbyName"></b><small id="lobbyEmail"></small></div></div>
      <div class="row"><button class="link" id="editProfile">인형 바꾸기</button><button class="link" id="logout">로그아웃</button></div>
    </div>
    <h2 class="title sm">게임 코드로 들어가기</h2>
    <form id="joinForm" class="row">
      <input id="joinCode" placeholder="예: K7QX2" maxlength="8" autocapitalize="characters" autocomplete="off">
      <button class="btn primary">들어가기</button>
    </form>
    <p class="msg" id="lobbyMsg"></p>
    <details id="createBox">
      <summary>진행자 — 새 게임 만들기</summary>
      <form id="createForm" class="stack">
        <input id="cName" placeholder="게임 이름 (예: 한옥마을 팀 미션)" required>
        <label>방식 — 팀 수는 게임 중에도 바꿀 수 있어요 <select id="cTeams"><option value="solo">개인전 (각자 점수)</option><option value="2">팀전 2팀</option><option value="3" selected>팀전 3팀</option><option value="4">팀전 4팀</option><option value="5">팀전 5팀</option><option value="6">팀전 6팀</option><option value="7">팀전 7팀</option><option value="8">팀전 8팀</option><option value="9">팀전 9팀</option><option value="10">팀전 10팀</option></select></label>
        <label>게임 지역 중심
          <select id="cCenter"><option value="jeonju">전주 한옥마을</option><option value="here">지금 내 위치</option><option value="custom">직접 입력 (위도, 경도)</option></select>
        </label>
        <input id="cLL" placeholder="35.8155, 127.1525" hidden>
        <label>반경 — 작을수록 위성사진이 선명해요 <select id="cRadius"><option value="200">200m</option><option value="300">300m</option><option value="500" selected>500m (권장)</option><option value="800">800m</option><option value="1000">1km</option></select></label>
        <button class="btn wide primary">만들기</button>
      </form>
    </details>
    <p class="fine"><a href="?demo">데모로 둘러보기</a> — 로그인 없이 가짜 참가자들이 걸어 다니는 화면</p>
  </div>
</section>

<!-- 게임 -->
<section id="game" class="screen" hidden>
  <div id="world"></div>
  <div class="nogl" id="nogl" hidden>이 기기에서는 3D를 그릴 수 없어요. 아래 목록으로 확인해 주세요.</div>
  <header class="hud">
    <div class="gtitle"><b id="gName"></b><small id="gStatus"></small><span class="timer" id="gTimer" hidden></span></div>
    <div class="scores" id="scores"></div>
  </header>
  <div class="fabs">
    <button class="fab" id="fabMe" title="내 위치" data-ic="locateOff"></button>
    <button class="fab" id="fabAll" title="전체 보기" data-ic="expand"></button>
    <button class="fab" id="fabLayer" title="위성/지도" data-ic="map"></button>
    <button class="fab" id="fabPocket" title="주머니 모드 — 화면을 까맣게 하고 위치만 계속 보내요" data-ic="moon"></button>
  </div>
  <div class="gpsbar" id="gpsBar">
    <button class="btn primary small" id="gpsBtn" data-ic="pin">위치 공유 켜기</button>
    <button class="btn small" id="simBtn" title="GPS 대신 게임 현장(전주) 가운데에 서고, 지도를 누르면 그리로 걸어가요 (현장 밖에서 시험할 때)" data-ic="flask">테스트 모드</button>
    <button class="btn small" id="offBtn" hidden>위치 공유 끄기</button>
    <span id="gpsText"></span>
  </div>
  <div class="placing" id="placing" hidden>지도를 눌러 미션 위치를 고르세요 <button class="link" id="placeCancel">취소</button></div>
  <div class="credit" id="credit"></div>
  <nav class="dock" id="dock">
    <div class="finder">
      <input id="find" type="search" placeholder="별칭이나 팀 이름으로 찾기" autocomplete="off" enterkeyhint="search">
      <div class="finds" id="finds" hidden></div>
    </div>
    <div class="tabs">
      <button data-tab="missions" class="on">미션</button>
      <button data-tab="people">사람</button>
      <button data-tab="feed">소식</button>
      <button data-tab="host" id="hostTab" hidden>진행</button>
      <button class="grip" id="grip" title="아래 창 접기/펴기">접기</button>
    </div>
    <div class="panel" id="panel"></div>
  </nav>
  <div class="toasts" id="toasts"></div>
</section>

<!-- 아래에서 올라오는 창 -->
<div class="sheet" id="sheet" hidden><div class="sheet-bg" data-close></div><div class="sheet-card" id="sheetCard"></div></div>

<!-- 비상구 화면 (위 스크립트가 띄운다) -->
<div class="rescue" id="rescue" hidden><div><b>앱을 불러오지 못했어요</b><p>새 판으로 바뀌는 중이었을 수 있어요.</p><button class="btn primary" onclick="hardReload()">다시 불러오기</button></div></div>

<script type="module" src="app.js"></script>
<!-- 주머니 모드: 화면은 켜 둔 채(위치가 계속 나가게) 까맣게 덮는다. 길게 눌러야 풀린다 -->
<div class="pocket" id="pocket" hidden>
  <div class="pk" id="pkBox">
    <b id="pkState"></b>
    <small id="pkSub"></small>
    <div class="pkhold"><i id="pkBar"></i></div>
    <small>길게 눌러 돌아가기</small>
  </div>
</div>
</body>
</html>
