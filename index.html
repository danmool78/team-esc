<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 화면 크기 고정: 확대 막기(maximum-scale은 아이폰 입력칸 확대까지 막는다), 자판이 떠도 화면 배치는 그대로(interactive-widget) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
<title>비전현장미션</title>
<meta name="theme-color" content="#15110d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<!-- 아이폰 홈 화면은 SVG 아이콘을 못 써서 PNG를 따로 둔다 -->
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="비전현장미션">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 로그인 -->
<section id="auth" class="screen center" hidden>
  <div class="card narrow">
    <p class="eyebrow">VISION FIELD MISSION</p>
    <h1 class="title">비전현장미션</h1>
    <p class="fine">팀원들과 실제로 걸으며 미션을 풀어요. 누가 어디 있는지, 상대 팀이 몇 개를 해냈는지 지도에서 바로 보여요.</p>
    <button id="googleBtn" class="btn wide google"><span>G</span> 구글 계정으로 시작</button>
    <div class="or">또는 이메일</div>
    <form id="emailForm" class="stack">
      <input id="email" type="email" placeholder="이메일" autocomplete="email" required>
      <input id="pw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" minlength="6" required>
      <button class="btn wide primary" id="emailBtn">로그인</button>
    </form>
    <div class="row between fine">
      <button class="link" id="toggleSign">처음이에요 — 가입하기</button>
      <button class="link" id="resetBtn">비밀번호를 잊었어요</button>
    </div>
    <p class="msg" id="authMsg"></p>
  </div>
</section>

<!-- 처음 한 번: 이름과 인형 -->
<section id="profile" class="screen center" hidden>
  <div class="card narrow">
    <p class="eyebrow">내 인형</p>
    <h2 class="title sm">지도 위에서 나를 대신할 인형</h2>
    <div class="avatarbox"><img id="avatarImg" alt=""><button class="btn ghost small" id="reroll">🎲 다시 뽑기</button></div>
    <div class="seg" id="genderSeg"><button data-g="m" class="on">남자</button><button data-g="f">여자</button></div>
    <label class="fine">별칭 — 지도 이름표와 검색에 쓰여요
      <input id="profName" placeholder="별칭 (2~12자)" maxlength="12" minlength="2"></label>
    <button class="btn wide primary" id="profSave">이대로 할게요</button>
  </div>
</section>

<!-- 게임 고르기 -->
<section id="lobby" class="screen center" hidden>
  <div class="card narrow">
    <div class="row between">
      <div class="me"><img id="lobbyAvatar" alt=""><div><b id="lobbyName"></b><small id="lobbyEmail"></small></div></div>
      <div class="row"><button class="link" id="editProfile">인형 바꾸기</button><button class="link" id="logout">로그아웃</button></div>
    </div>
    <h2 class="title sm">게임 코드로 들어가기</h2>
    <form id="joinForm" class="row">
      <input id="joinCode" placeholder="예: K7QX2" maxlength="8" autocapitalize="characters" autocomplete="off">
      <button class="btn primary">들어가기</button>
    </form>
    <p class="msg" id="lobbyMsg"></p>
    <details id="createBox">
      <summary>진행자 — 새 게임 만들기</summary>
      <form id="createForm" class="stack">
        <input id="cName" placeholder="게임 이름 (예: 한옥마을 팀 미션)" required>
        <label>팀 수 <select id="cTeams"><option>2</option><option selected>3</option><option>4</option></select></label>
        <label>게임 지역 중심
          <select id="cCenter"><option value="jeonju">전주 한옥마을</option><option value="here">지금 내 위치</option><option value="custom">직접 입력 (위도, 경도)</option></select>
        </label>
        <input id="cLL" placeholder="35.8155, 127.1525" hidden>
        <label>반경 — 작을수록 위성사진이 선명해요 <select id="cRadius"><option value="200">200m</option><option value="300">300m</option><option value="500" selected>500m (권장)</option><option value="800">800m</option><option value="1000">1km</option></select></label>
        <button class="btn wide primary">만들기</button>
      </form>
    </details>
    <p class="fine"><a href="?demo">데모로 둘러보기</a> — 로그인 없이 가짜 참가자들이 걸어 다니는 화면</p>
  </div>
</section>

<!-- 게임 -->
<section id="game" class="screen" hidden>
  <div id="world"></div>
  <div class="nogl" id="nogl" hidden>이 기기에서는 3D를 그릴 수 없어요. 아래 목록으로 확인해 주세요.</div>
  <header class="hud">
    <div class="gtitle"><b id="gName"></b><small id="gStatus"></small></div>
    <div class="scores" id="scores"></div>
  </header>
  <div class="fabs">
    <button class="fab" id="fabMe" title="내 위치">◎</button>
    <button class="fab" id="fabAll" title="전체 보기">⤢</button>
    <button class="fab" id="fabLayer" title="위성/지도">🗺</button>
    <button class="fab" id="fabPocket" title="주머니 모드 — 화면을 까맣게 하고 위치만 계속 보내요">🌙</button>
  </div>
  <div class="gpsbar" id="gpsBar">
    <button class="btn primary small" id="gpsBtn">📍 위치 공유 켜기</button>
    <button class="btn small" id="simBtn" title="GPS 대신 게임 현장(전주) 가운데에 서고, 지도를 누르면 그리로 걸어가요 (현장 밖에서 시험할 때)">🧪 테스트 모드</button>
    <button class="btn small" id="offBtn" hidden>위치 공유 끄기</button>
    <span id="gpsText"></span>
  </div>
  <div class="placing" id="placing" hidden>지도를 눌러 미션 위치를 고르세요 <button class="link" id="placeCancel">취소</button></div>
  <div class="credit" id="credit"></div>
  <nav class="dock" id="dock">
    <button class="handle" id="handle" aria-label="아래 창 접기/펴기"><i></i></button>
    <div class="finder">
      <input id="find" type="search" placeholder="🔍 별칭이나 팀 이름으로 찾기" autocomplete="off" enterkeyhint="search">
      <div class="finds" id="finds" hidden></div>
    </div>
    <div class="tabs">
      <button data-tab="missions" class="on">미션</button>
      <button data-tab="people">사람</button>
      <button data-tab="feed">소식</button>
      <button data-tab="host" id="hostTab" hidden>진행</button>
      <button class="grip" id="grip" title="아래 창 접기/펴기">접기 ▾</button>
    </div>
    <div class="panel" id="panel"></div>
  </nav>
  <div class="toasts" id="toasts"></div>
</section>

<!-- 아래에서 올라오는 창 -->
<div class="sheet" id="sheet" hidden><div class="sheet-bg" data-close></div><div class="sheet-card" id="sheetCard"></div></div>

<script type="module" src="app.js"></script>
<!-- 주머니 모드: 화면은 켜 둔 채(위치가 계속 나가게) 까맣게 덮는다. 길게 눌러야 풀린다 -->
<div class="pocket" id="pocket" hidden>
  <div class="pk" id="pkBox">
    <b id="pkState"></b>
    <small id="pkSub"></small>
    <div class="pkhold"><i id="pkBar"></i></div>
    <small>길게 눌러 돌아가기</small>
  </div>
</div>
</body>
</html>
