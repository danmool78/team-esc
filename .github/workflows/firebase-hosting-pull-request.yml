name: Deploy to Firebase Hosting preview on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 판 번호: index.html과 app.js의 __BUILD__를 커밋 번호로 — 둘이 어긋나면(예전 화면을 들고 있으면) 앱이 스스로 새로 불러온다
      - name: Stamp build id
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" index.html app.js
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEAM_ESC }}
          projectId: team-esc
          expires: 3d
