<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>사진 모음 · 비전 퀘스트</title>
<meta name="description" content="비전 퀘스트 — 미션마다 인정된 사진 모음">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<style>
  :root{--gold:#f0c76a;--ink:#e6e9f2;--muted:#aab2cc;--card:rgba(12,18,38,.86);--line:rgba(240,199,106,.35)}
  *{box-sizing:border-box}
  html{background:#0a0e1c}
  body{margin:0;background:radial-gradient(ellipse at 50% 0%,#1d2440,#0a0e1c 70%) fixed;color:var(--ink);font:15px/1.6 "Noto Sans KR",system-ui,sans-serif;-webkit-text-size-adjust:100%}
  main{max-width:960px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 24px) 16px 48px}
  header{text-align:center;margin-bottom:16px}
  header img{width:min(240px,64%);height:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
  h1{font-size:22px;color:var(--gold);margin:8px 0 2px;line-height:1.35}
  .sub{color:var(--muted);font-size:13px}
  .jump{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
  .jump::-webkit-scrollbar{display:none}
  .jump a{flex:none;font-size:13px;color:var(--ink);text-decoration:none;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:4px 12px;white-space:nowrap}
  .jump a b{color:var(--gold);margin-left:4px}
  section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;scroll-margin-top:12px}
  h2{font-size:16px;color:#fff;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  h2 small{color:var(--gold);font-size:13px;font-weight:600;margin-left:auto}
  .ico{width:22px;height:22px;flex:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  @media (max-width:480px){.grid{grid-template-columns:repeat(2,1fr)}}
  figure{margin:0;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.05);cursor:zoom-in}
  figure .ph{aspect-ratio:1;background:#151b30 center/cover no-repeat;display:grid;place-items:center;color:var(--muted);font-size:12px}
  figcaption{display:flex;align-items:center;gap:6px;padding:6px 9px;font-size:12.5px;color:#dfe4f2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  figcaption i{width:9px;height:9px;border-radius:50%;flex:none}
  .empty{color:var(--muted);text-align:center;padding:30px 0}
  .dlbar{text-align:center;margin:0 0 14px}
  .dlbar button{border:0;border-radius:12px;padding:13px 22px;font:inherit;font-size:17px;font-weight:700;background:linear-gradient(#f6d684,#d9a440);color:#2a1d08;cursor:pointer}
  .dlbar button:disabled{opacity:.6;cursor:default}
  .dlbar p{margin:8px 0 0;color:var(--muted);font-size:14px;min-height:1em}
  .recs{display:grid;gap:10px}
  .rec{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px}
  .rec .who{display:flex;align-items:center;gap:6px;font-size:15px;min-width:90px}
  .rec .who i{width:10px;height:10px;border-radius:50%;flex:none}
  .rec audio{flex:1;min-width:200px;height:40px}
  .rec .st{color:var(--muted);font-size:13px}
  #lb{position:fixed;inset:0;background:rgba(4,6,14,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;z-index:9}
  #lb[hidden]{display:none}
  #lb img{max-width:100%;max-height:calc(100vh - 140px);border-radius:10px;object-fit:contain}
  #lb .cap{color:#fff;font-size:14px;text-align:center}
  #lb .cap small{display:block;color:var(--muted)}
  #lb .bar{display:flex;gap:8px}
  #lb button,#lb a{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;text-decoration:none;cursor:pointer}
  footer{margin-top:22px;color:#8d96b3;font-size:12px;line-height:1.7;text-align:center}
</style>
</head>
<body>
<main>
  <header>
    <img src="assets/title.webp" alt="비전 퀘스트">
    <h1 id="gName">사진 모음</h1>
    <div class="sub" id="gSub">불러오는 중…</div>
  </header>
  <div class="dlbar" id="dlbar" hidden><button id="dlAll">전부 내려받기</button><p id="dlMsg"></p></div>
  <nav class="jump" id="jump"></nav>
  <div id="body"></div>
  <footer>진행자가 인정한 사진과 녹음만 모았어요. 게임이 끝나고 7일 뒤 서버에서 지워지니, 남기고 싶은 사진은 저장해 두세요.<br>© 2026 SSSOFT · <a href="privacy.html" style="color:inherit">개인정보처리방침</a></footer>
</main>
<div id="lb" hidden><img alt=""><div class="cap"></div><div class="bar"><button id="lbPrev">‹ 이전</button><a id="lbSave" download>저장</a><button id="lbNext">다음 ›</button><button id="lbX">닫기</button></div></div>
<script type="module">
/* 사진 모음 페이지: album.html?g=게임코드 — 진행자가 인정할 때 옮겨 둔 games/{코드}/albumIdx·album을 로그인 없이 읽어 미션별로 보여 준다.
   목록(albumIdx)을 먼저 받아 틀을 그리고, 사진(album/{key})은 화면에 가까워질 때 하나씩 받는다(사진이 많아도 처음이 빠르게).
   ?demo면 서버 없이 그려 본 가짜 사진으로 (데모 게임은 그 폰 메모리에만 있어서) */
import { ic } from './icons.js';

const q = new URLSearchParams(location.search);
const code = (q.get('g') || '').trim().toUpperCase();
const DEMO = q.has('demo');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);
const safe = u => (typeof u === 'string' && /^data:image\/[\w.+-]+;base64,[A-Za-z0-9+/=]+$/.test(u) ? u : ''); // 그림 data URL만 (저장 링크·배경으로 쓰므로)
const safeAudio = u => (typeof u === 'string' && /^data:audio\/[\w.+-]+(;[\w.+=-]+)*;base64,[A-Za-z0-9+/=]+$/.test(u) ? u : ''); // 음성 녹음
let src; // { name, idx, photo(key) }

async function load() {
  if (DEMO) {
    const teams = [['청팀', '#4f8de8'], ['홍팀', '#e8574f'], ['녹팀', '#4fbf6a']];
    const ms = ['경기전 홍살문 단체 사진', '전동성당 팀 구호', '전주향교 은행나무', '술래잡기: 한옥마을'];
    const idx = {};
    ms.forEach((title, i) => teams.forEach(([n, c], j) => { if ((i + j) % 4 !== 3) idx[`t${j}_m${i}`] = { mid: 'm' + i, title, who: n, color: c, t: Date.now() - (i * 3 + j) * 6e5 }; }));
    idx.u_a_m2 = { mid: 'm2', title: ms[2], who: '청팀 · 다윗', color: '#4f8de8', t: Date.now() };
    ['청팀', '홍팀'].forEach((n, j) => (idx[`t${j}_mv`] = { mid: 'mv', title: '오목대 팀 응원가', who: n, color: ['#4f8de8', '#e8574f'][j], t: Date.now(), kind: 'audio' }));
    // 미션·팀마다 다른 색 그림 (실제 사진 대신)
    const photo = async key => {
      if (idx[key].kind === 'audio') { // 0.6초 삐 소리 WAV
        const sr = 8000, n = sr * 0.6, b = new Uint8Array(44 + n), v = new DataView(b.buffer), w = (o, s) => [...s].forEach((c, i) => (b[o + i] = c.charCodeAt(0)));
        w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
        for (let i = 0; i < n; i++) b[44 + i] = 128 + Math.round(40 * Math.sin(i / sr * 2 * Math.PI * 523));
        let s = ''; b.forEach(c => (s += String.fromCharCode(c))); return 'data:audio/wav;base64,' + btoa(s);
      }
      const x = idx[key], cv = Object.assign(document.createElement('canvas'), { width: 480, height: 480 }), g = cv.getContext('2d');
      const gr = g.createLinearGradient(0, 0, 480, 480); gr.addColorStop(0, x.color); gr.addColorStop(1, '#1b2340');
      g.fillStyle = gr; g.fillRect(0, 0, 480, 480);
      g.fillStyle = 'rgba(255,255,255,.85)'; g.font = 'bold 30px sans-serif'; g.textAlign = 'center';
      g.fillText(x.title.slice(0, 12), 240, 230); g.font = '24px sans-serif'; g.fillText(x.who, 240, 275);
      return cv.toDataURL('image/jpeg', 0.8);
    };
    return { name: '한옥마을 팀 미션 (데모)', idx, photo, order: ms };
  }
  if (!code) return null;
  const net = await import('./net.js');
  const [idx, guide] = await Promise.all([net.albumIdx(code), net.readGuide(code).catch(() => null)]);
  return { name: guide?.name || '', idx, photo: key => net.albumPhoto(code, key), order: guide?.missions?.map(m => m.title) || [] };
}

function render() {
  const items = Object.entries(src.idx).map(([key, x]) => ({ key, ...x }));
  $('#gName').textContent = src.name ? `${src.name} 사진 모음` : '사진 모음';
  if (src.name) document.title = `${src.name} 사진 모음 · 비전 퀘스트`;
  const nA = items.filter(x => x.kind === 'audio').length, nP = items.length - nA;
  $('#gSub').textContent = `${code ? `게임 코드 ${code} · ` : ''}사진 ${nP}장${nA ? ` · 녹음 ${nA}개` : ''}`;
  if (!items.length) { $('#body').innerHTML = '<section><p class="empty">아직 인정된 사진·녹음이 없어요.</p></section>'; return; }
  $('#dlbar').hidden = false;
  $('#dlAll').onclick = () => downloadAll(items);
  // 미션별로 묶고, 미션 순서는 안내 페이지 순서(없으면 처음 올라온 순)
  const groups = new Map();
  items.sort((a, b) => a.t - b.t).forEach(x => { if (!groups.has(x.mid)) groups.set(x.mid, []); groups.get(x.mid).push(x); });
  const pos = t => { const i = src.order?.indexOf(t); return i >= 0 ? i : 1e3; };
  const list = [...groups.values()].sort((a, b) => pos(a[0].title) - pos(b[0].title));
  $('#jump').innerHTML = list.map((g, i) => `<a href="#s${i}">${esc(g[0].title)}<b>${g.length}</b></a>`).join('');
  // 녹음(kind audio)은 재생 막대로, 사진은 격자로
  $('#body').innerHTML = list.map((g, i) => { const aud = g[0].kind === 'audio'; return `<section id="s${i}"><h2>${ic(aud ? 'mic' : g[0].title.startsWith('술래') ? 'tag' : 'camera')}${esc(g[0].title)}<small>${g.length}${aud ? '개' : '장'}</small></h2>
    ${aud ? `<div class="recs">${g.map(x => `<div class="rec" data-a="${esc(x.key)}"><span class="who"><i style="background:${esc(x.color)}"></i>${esc(x.who)}</span><audio controls preload="none"></audio><small class="st">불러오는 중…</small></div>`).join('')}</div>`
      : `<div class="grid">${g.map(x => `<figure data-k="${esc(x.key)}"><div class="ph">불러오는 중…</div><figcaption><i style="background:${esc(x.color)}"></i>${esc(x.who)}</figcaption></figure>`).join('')}</div>`}</section>`; }).join('');
  // 화면 가까이 온 사진만 받는다
  const urls = {};
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    io.unobserve(e.target);
    const k = e.target.dataset.k, ph = e.target.querySelector('.ph');
    Promise.resolve(src.photo(k)).then(u => { u = safe(u); if (!u) { ph.textContent = '사진이 없어요'; return; } urls[k] = u; ph.textContent = ''; ph.style.backgroundImage = `url("${u}")`; })
      .catch(() => (ph.textContent = '불러오지 못했어요'));
  }), { rootMargin: '400px' });
  const figs = [...document.querySelectorAll('figure')];
  figs.forEach(f => io.observe(f));
  // 녹음: 화면 가까이 오면 받아 재생 막대에 넣는다
  const ia = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    ia.unobserve(e.target);
    const k = e.target.dataset.a, st = e.target.querySelector('.st');
    Promise.resolve(src.photo(k)).then(u => { u = safeAudio(u); if (!u) { st.textContent = '녹음이 없어요'; return; } e.target.querySelector('audio').src = u; st.remove(); })
      .catch(() => (st.textContent = '불러오지 못했어요'));
  }), { rootMargin: '400px' });
  document.querySelectorAll('.rec[data-a]').forEach(r => ia.observe(r));
  // 크게 보기: 이전·다음·저장
  let cur = -1;
  const open = i => {
    cur = (i + figs.length) % figs.length;
    const f = figs[cur], k = f.dataset.k, x = src.idx[k], show = u => { $('#lb img').src = u; $('#lbSave').href = u; };
    $('#lb img').src = ''; $('#lbSave').download = `vision-quest-${code || 'demo'}-${k}.jpg`;
    $('#lb .cap').innerHTML = `${esc(x.title)}<small>${esc(x.who)}</small>`;
    if (urls[k]) show(urls[k]); else Promise.resolve(src.photo(k)).then(u => { u = safe(u); if (u) { urls[k] = u; if (figs[cur] === f) show(u); } });
    $('#lb').hidden = false;
  };
  figs.forEach((f, i) => (f.onclick = () => open(i)));
  $('#lbPrev').onclick = () => open(cur - 1);
  $('#lbNext').onclick = () => open(cur + 1);
  $('#lbX').onclick = () => ($('#lb').hidden = true);
  $('#lb').onclick = e => { if (e.target.id === 'lb') $('#lb').hidden = true; };
  addEventListener('keydown', e => { if ($('#lb').hidden) return; if (e.key === 'Escape') $('#lb').hidden = true; if (e.key === 'ArrowLeft') open(cur - 1); if (e.key === 'ArrowRight') open(cur + 1); });
}

/* ---------- 전부 내려받기: 사진·녹음을 zip 하나로 ----------
   라이브러리 없이 '그대로 담기(stored)' zip을 만든다 — JPEG·녹음은 이미 압축돼 있어 더 줄지 않는다.
   파일 이름은 '미션/팀·이름 (n).jpg', 한글 이름이 깨지지 않게 UTF-8 표시(bit 11)를 켠다 */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = 0xffffffff; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; };
function makeZip(files) {
  const enc = new TextEncoder(), parts = [], dir = [];
  let off = 0;
  const d = new Date(), dt = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)), dd = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate());
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.data), n = f.data.length;
    const h = new DataView(new ArrayBuffer(30));
    [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [8, 0, 2], [10, dt, 2], [12, dd, 2], [14, crc, 4], [18, n, 4], [22, n, 4], [26, name.length, 2], [28, 0, 2]].forEach(([o, v, s]) => (s === 4 ? h.setUint32(o, v, true) : h.setUint16(o, v, true)));
    parts.push(new Uint8Array(h.buffer), name, f.data);
    const c = new DataView(new ArrayBuffer(46));
    [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, dt, 2], [14, dd, 2], [16, crc, 4], [20, n, 4], [24, n, 4], [28, name.length, 2], [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, 0, 4], [42, off, 4]].forEach(([o, v, s]) => (s === 4 ? c.setUint32(o, v, true) : c.setUint16(o, v, true)));
    dir.push(new Uint8Array(c.buffer), name);
    off += 30 + name.length + n;
  }
  const size = dir.reduce((a, p) => a + p.length, 0), e = new DataView(new ArrayBuffer(22));
  [[0, 0x06054b50, 4], [8, files.length, 2], [10, files.length, 2], [12, size, 4], [16, off, 4], [20, 0, 2]].forEach(([o, v, s]) => (s === 4 ? e.setUint32(o, v, true) : e.setUint16(o, v, true)));
  return new Blob([...parts, ...dir, new Uint8Array(e.buffer)], { type: 'application/zip' });
}
const fromDataUrl = u => { const [head, b64] = u.split(','), bin = atob(b64), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return { mime: head.slice(5).split(';')[0], data: a }; };
const EXT = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'audio/webm': 'webm', 'audio/mp4': 'm4a', 'audio/ogg': 'ogg', 'audio/wav': 'wav', 'audio/mpeg': 'mp3' };
const clean = s => String(s || '').replace(/[\\/:*?"<>|]+/g, ' ').trim().slice(0, 60) || '이름 없음';
async function downloadAll(items) {
  const btn = $('#dlAll'), msg = $('#dlMsg');
  btn.disabled = true;
  const files = [], used = new Set();
  let i = 0, miss = 0;
  for (const x of items) {
    msg.textContent = `모으는 중… ${++i} / ${items.length}`;
    let u = await Promise.resolve(src.photo(x.key)).catch(() => null);
    u = x.kind === 'audio' ? safeAudio(u) : safe(u);
    if (!u) { miss++; continue; }
    const { mime, data } = fromDataUrl(u);
    let base = `${clean(x.title)}/${clean(x.who)}`, name = `${base}.${EXT[mime] || 'bin'}`, k = 2;
    while (used.has(name)) name = `${base} (${k++}).${EXT[mime] || 'bin'}`;
    used.add(name); files.push({ name, data });
  }
  if (!files.length) { msg.textContent = '내려받을 사진·녹음이 없어요.'; btn.disabled = false; return; }
  const blob = makeZip(files), a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `vision-quest-album-${code || 'demo'}.zip`; // 영문 이름: 일부 브라우저가 한글 파일 이름을 바꿔 버린다
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  msg.textContent = `${files.length}개를 zip 파일 하나로 내려받았어요 (${(blob.size / 1048576).toFixed(1)}MB)${miss ? ` · ${miss}개는 불러오지 못했어요` : ''}. 카카오톡 안에서 안 되면 바깥 브라우저로 열어 주세요.`;
  btn.disabled = false;
}

load().then(s => {
  if (!s) { $('#gSub').textContent = ''; $('#body').innerHTML = '<section><p class="empty">게임 코드가 없는 주소예요. 진행자에게 받은 링크로 열어 주세요.</p></section>'; return; }
  src = s; render();
}).catch(e => { console.error(e); $('#gSub').textContent = '사진을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.'; });
</script>
</body>
</html>
